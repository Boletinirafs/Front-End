<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eu draivo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href=".images/pageIcon.jpg">
</head>
<body>
    <header class="title">
        <h1>

                </div>

                <h2>
                    Quem é Agostinho "Estilo" Carrara?
                </h2>
                <p>
                    "Para alguns, um simples personagem, para outros um ícone, e para os mais atentos, um exemplo."
                </p>
                <button class="pictureSwitch">
                    <h3>
                        Clique na foto para passar para a próxima
                    </h3>

            </div>
            <div class="slideShow">

    <footer>
